<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connexion TikTok · Lucas FPV</title>
  <style>
    body { margin:0; background:#101822; color:white; font:18px/1.5 system-ui; }
    main { max-width:32rem; margin:auto; padding:2rem 1rem; }
    input,button,textarea { display:block; box-sizing:border-box; width:100%; font:inherit; padding:.6rem; margin:.5rem 0 1rem; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <h1>Connexion TikTok · Lucas FPV</h1>
  <p>Version autonome · A</p>
  <p id="message" role="status">Le code de la page n’a pas démarré. Ne saisis rien.</p>
  <noscript>JavaScript est désactivé dans ce navigateur.</noscript>
  <form id="connexion" hidden>
    <label for="key">Client key du Sandbox (jamais le Client secret)</label>
    <input id="key" required autocomplete="off" spellcheck="false" autocapitalize="none">
    <button type="submit">Connecter mon compte TikTok</button>
  </form>
  <section id="resultat" hidden>
    <label for="code">Code temporaire privé : ne le partage pas.</label>
    <textarea id="code" readonly></textarea>
  </section>
</main>
<script data-cfasync="false">
(function () {
  'use strict';
  var msg = document.getElementById('message');
  var form = document.getElementById('connexion');
  var callback = 'https://cappy28.github.io/lucas_fpv28/tiktok-callback.html';
  var slot = 'lucasfpv:tiktok:state';
  function ready(text) { msg.textContent = text; form.hidden = false; }
  try {
    var params = new URLSearchParams(location.search);
    if (params.has('code') || params.has('error')) {
      history.replaceState(null, '', location.pathname);
      var expected = sessionStorage.getItem(slot);
      sessionStorage.removeItem(slot);
      if (!expected || params.get('state') !== expected) {
        ready('Retour non reconnu. Recommence depuis cet onglet.');
      } else if (params.has('error') || !params.get('code')) {
        ready('Autorisation non obtenue. Tu peux réessayer.');
      } else if (params.has('scopes') && !params.get('scopes').split(/[,\s]+/).includes('user.info.stats')) {
        ready('La lecture du compteur n’a pas été autorisée.');
      } else {
        document.getElementById('code').value = params.get('code');
        document.getElementById('resultat').hidden = false;
        msg.textContent = 'Autorisation reçue. Garde ce code privé.';
      }
    } else {
      ready('Prêt. Colle uniquement ta Client key.');
    }
  } catch (e) { msg.textContent = 'Impossible de vérifier le retour. Rouvre la page sans paramètres dans un onglet normal.'; }
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    try {
      if (location.origin + location.pathname !== callback) { msg.textContent = 'Ouvre la page sur ton site GitHub Pages.'; return; }
      var key = document.getElementById('key').value.trim();
      if (!key) { msg.textContent = 'La Client key est vide.'; return; }
      var bytes = crypto.getRandomValues(new Uint8Array(24));
      var state = Array.from(bytes, function(n) { return ('0' + n.toString(16)).slice(-2); }).join('');
      sessionStorage.setItem(slot, state);
      var url = new URL('https://www.tiktok.com/v2/auth/authorize/');
      url.searchParams.set('client_key', key);
      url.searchParams.set('response_type', 'code');
      url.searchParams.set('scope', 'user.info.stats');
      url.searchParams.set('state', state);
      url.searchParams.set('redirect_uri', callback);
      msg.textContent = 'Ouverture de TikTok…';
      location.assign(url.href);
    } catch (e) { msg.textContent = 'Connexion non démarrée. Vérifie que le stockage de session est autorisé.'; }
  });
})();
</script>
</body>
</html>
