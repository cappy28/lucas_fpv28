<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Lucas FPV · Connexion TikTok</title><style>body{font:1.1rem/1.55 system-ui;background:#101822;color:#fafafa;margin:0}main{max-width:34rem;margin:auto;padding:2rem 1rem}input,button{display:block;font:inherit;border-radius:.5rem;padding:.65rem;margin:.6rem 0 1rem}button{cursor:pointer}input{width:90%}[hidden]{display:none!important}</style></head><body><main><h1>Connexion TikTok · Lucas FPV</h1><p id="message" role="status">Page de retour prête.</p><form id="form"><label for="key">Colle la Client key du Sandbox TikTok (pas le Client secret).</label><input id="key" required autocomplete="off" autocapitalize="none" spellcheck="false"><button>Connecter mon compte TikTok</button></form><section id="result" hidden><button id="copy">Copier le code privé</button><p>Dans GitHub, enregistre aussitôt ce code comme secret Actions nommé <strong>TIKTOK_AUTH_CODE</strong>. Ne le partage pas dans le chat. Ce code temporaire n’est pas encore un jeton d’accès.</p></section></main><script type="b5b6ee693083e7d08137e232-text/javascript">

 history.replaceState(null,'',location.pathname);

form.onsubmit=e=>{e.preventDefault();if(location.origin+location.pathname!==callback){msg.textContent='Ouvre cette page depuis ton site GitHub Pages pour commencer.';return;}const key=document.querySelector('#key').value.trim();if(!key)return;const state=Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('');sessionStorage.setItem(slot,state);const u=new URL('https://www.tiktok.com/v2/auth/authorize/');u.search=new URLSearchParams({client_key:key,response_type:'code',scope:'user.info.stats',redirect_uri:callback,state}).toString();location.assign(u);};
