<body><main><h1>Connexion TikTok · Lucas FPV</h1><p>Version 4 · Lucas FPV</p><p id="msg" role="status">Le script n’a pas démarré. Ne saisis pas de clé sur cet écran.</p><form id="form" hidden><label for="key">Client key du Sandbox (jamais le Client secret)</label><input id="key" required autocomplete="off" autocapitalize="none" spellcheck="false"><button>Connecter mon compte TikTok</button></form><section id="result" hidden><label for="code">Code temporaire privé : copie-le sans le partager.</label><textarea id="code" readonly></textarea></section></main>
<script type="69a56afb56e41f26407979d7-text/javascript">
'use strict';
const el=id=>document.getElementById(id), msg=el('msg'), form=el('form');
const callback='https://cappy28.github.io/lucas_fpv28/tiktok-callback.html', slot='lucasfpv:tiktok:state';
const p=new URLSearchParams(location.search);
function start(text){form.hidden=false;msg.textContent=text;}
try{
 if(p.has('code')||p.has('error')){
  history.replaceState(null,'',location.pathname);
  const expected=sessionStorage.getItem(slot);sessionStorage.removeItem(slot);
  if(!expected||expected!==p.get('state'))start('Retour non reconnu. Recommence dans cet onglet.');
  else if(p.has('error')||!p.get('code'))start('Autorisation non obtenue. Tu peux réessayer.');
  else if(p.has('scopes')&&!p.get('scopes').split(/[,\s]+/).includes('user.info.stats'))start('Autorisation de lire le compteur manquante.');
  else{el('code').value=p.get('code');el('result').hidden=false;msg.textContent='Autorisation reçue. Garde ce code privé.';}
 }else start('Prêt. Colle uniquement ta Client key.');
}catch{msg.textContent='Impossible de vérifier le retour. Recommence depuis la page sans paramètres, dans un onglet normal.';}
form.onsubmit=e=>{e.preventDefault();try{
 if(location.origin+location.pathname!==callback){msg.textContent='Ouvre la page publiée sur GitHub Pages.';return;}
 const key=el('key').value.trim();if(!key){msg.textContent='La Client key est vide.';return;}
 const state=Array.from(crypto.getRandomValues(new Uint8Array(24)),n=>n.toString(16).padStart(2,'0')).join('');sessionStorage.setItem(slot,state);
 const u=new URL('https://www.tiktok.com/v2/auth/authorize/');u.search=new URLSearchParams({client_key:key,response_type:'code',scope:'user.info.stats',state:state,redirect_uri:callback}).toString();msg.textContent='Ouverture de TikTok…';location.assign(u.href);
}catch{msg.textContent='Impossible de démarrer la connexion. Vérifie que le navigateur autorise le stockage de session.';}};
