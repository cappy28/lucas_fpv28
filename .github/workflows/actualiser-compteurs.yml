# Nouveau fichier : .github/workflows/actualiser-compteurs.yml
# Premier essai : Actions > Actualiser les compteurs > Run workflow (branche par défaut).
# Produit stats.json dans le dépôt. Aucun changement du HTML dans cette étape.
name: Actualiser les compteurs
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: lucas-fpv-compteurs
  cancel-in-progress: false
jobs:
  compteurs:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lire Instagram, YouTube et TikTok
        env:
          IG_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IG_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YT_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TT_REFRESH: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.REPO_SECRETS_WRITER }}
        shell: python
        run: |
          import os, json, time, subprocess, sys
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from urllib.error import HTTPError
          e = os.environ
          def api(url, headers=None, form=None):
              req = Request(url, headers=headers or {}, data=urlencode(form).encode() if form else None)
              with urlopen(req, timeout=25) as response:
                  return json.load(response)
          def bearer(token):
              return {'Authorization': 'Bearer ' + token}
          stage = 'Vérification des secrets'
          try:
              for name in ('IG_ID','IG_TOKEN','YT_KEY','TT_KEY','TT_SECRET','TT_REFRESH','GH_TOKEN'):
                  if not e.get(name): sys.exit('Secret manquant pour ' + name)
              stage = 'Instagram'
              if not e['IG_ID'].isdigit(): sys.exit('ID Instagram incorrect.')
              ig = api('https://graph.facebook.com/v25.0/' + e['IG_ID'] + '?fields=username,followers_count', bearer(e['IG_TOKEN']))
              if ig['username'] != 'lucas_fpv28': sys.exit('Compte Instagram inattendu.')
              stage = 'YouTube'
              yt = api('https://www.googleapis.com/youtube/v3/channels?part=statistics&forHandle=%40lucas_fpv28', {'X-Goog-Api-Key': e['YT_KEY']})['items'][0]['statistics']
              if yt.get('hiddenSubscriberCount'): sys.exit('Compteur YouTube masqué.')
              stage = 'TikTok : renouvellement'
              tok = api('https://open.tiktokapis.com/v2/oauth/token/', form={'grant_type':'refresh_token','client_key':e['TT_KEY'],'client_secret':e['TT_SECRET'],'refresh_token':e['TT_REFRESH']})
              new = tok['refresh_token']
              if not new: sys.exit('TikTok n’a pas renvoyé de jeton de renouvellement.')
              if new != e['TT_REFRESH']:
                  stage = 'Sauvegarde du nouveau jeton TikTok'
                  for attempt in range(3):
                      result = subprocess.run(['gh','secret','set','TIKTOK_REFRESH_TOKEN','--repo',e['GITHUB_REPOSITORY']], input=new, text=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                      if result.returncode == 0: break
                      time.sleep(2)
                  else: sys.exit('Sauvegarde impossible : vérifie REPO_SECRETS_WRITER avant une nouvelle initialisation TikTok.')
              stage = 'TikTok : lecture du compteur'
              tt = api('https://open.tiktokapis.com/v2/user/info/?fields=follower_count', bearer(tok['access_token']))
              counts = {'youtube': int(yt['subscriberCount']), 'instagram': ig['followers_count'], 'tiktok': tt['data']['user']['follower_count']}
              if any(type(v) is not int or v < 0 for v in counts.values()): sys.exit('Compteur absent ou invalide.')
          except HTTPError as err:
              sys.exit(f'{stage} : HTTP {err.code}. Aucun nouveau compteur publié.')
          except Exception as err:
              sys.exit(f'{stage} : {type(err).__name__}. Aucun nouveau compteur publié.')
          data = {'at': int(time.time()*1000), 'stats': counts, 'total': sum(counts.values())}
          Path('stats.json').write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          with open(e['GITHUB_STEP_SUMMARY'], 'a') as out:
              for name, value in counts.items(): print(f'- {name} : {value}', file=out)
              print(f"- **Total : {data['total']}**", file=out)
      - name: Enregistrer uniquement stats.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- stats.json
          git commit -m 'Actualiser les compteurs publics'
          git push
